name: Build & Release Elix IDE

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer
        run: npm run build:installer

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elix-IDE-Windows-Setup
          path: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (.deb, .rpm, .AppImage, .tar.gz)
        run: npm run build:linux

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elix-IDE-Linux-Packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.tar.gz

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (.dmg, .zip)
        run: npm run build:mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elix-IDE-Mac-Installer
          path: |
            release/*.dmg
            release/*.zip

