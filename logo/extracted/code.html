<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <!-- Dark Slate Grey Background -->
  <rect width="800" height="800" rx="32" fill="#0F141C" />

  <!-- Subtle Editorial Construction Grid & Geometry Frame (low opacity architectural aesthetic) -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="1">
    <!-- Outer boundary box -->
    <rect x="180" y="160" width="440" height="360" rx="4" stroke-dasharray="3 6" />
    <!-- Center guidelines -->
    <line x1="400" y1="120" x2="400" y2="560" stroke-dasharray="4 6" />
    <line x1="140" y1="340" x2="660" y2="340" stroke-dasharray="4 6" />
    <circle cx="400" cy="340" r="180" stroke-dasharray="2 6" />
  </g>

  <!-- Precision Minimalist Monogram: Geometric 'E' + Code Bracket & Levitating Floating Segment -->
  <!-- Crisp, flat solid strokes, zero glossy gradients or fluff -->
  <g id="brand-symbol">
    <!-- Floating Top Bar of 'E' with terminal notch (Weightless / Antigravity feel) -->
    <path d="M 280 220 L 510 220" stroke="#F1F5F9" stroke-width="24" stroke-linecap="round" />

    <!-- Center Segment: Syntax bracket arm `<` forming the middle bar of 'E' -->
    <path d="M 370 295 L 305 340 L 370 385" stroke="#E2E8F0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 305 340 L 460 340" stroke="#E2E8F0" stroke-width="24" stroke-linecap="round" />

    <!-- Bottom Structural Base of 'E' -->
    <path d="M 280 460 L 510 460" stroke="#F1F5F9" stroke-width="24" stroke-linecap="round" />

    <!-- Vertical Spine connecting top and bottom with clean precision cutouts -->
    <path d="M 280 220 L 280 460" stroke="#F1F5F9" stroke-width="24" stroke-linecap="round" />

    <!-- Signature Accent: Single electric cyan status pulse / prompt dot -->
    <!-- Positioned with mathematical rhythm relative to the middle bracket terminal -->
    <circle cx="505" cy="340" r="14" fill="#00E5FF" />
  </g>

  <!-- Authentic Software Tool Typography: Strict Monospace & Micro-typography -->
  <g transform="translate(400, 620)" text-anchor="middle">
    <!-- Logotype -->
    <text font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="44" font-weight="600" letter-spacing="-1.5" fill="#F8FAFC">
      elix<tspan fill="#00E5FF">.</tspan>ede
    </text>

    <!-- Subtitle / Meta descriptor -->
    <text y="44" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="12" font-weight="500" letter-spacing="7" fill="#64748B">
      CLOUD RUNTIME &amp; ENVIRONMENT
    </text>
  </g>
</svg>
